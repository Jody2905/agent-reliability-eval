[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-eval"
version = "0.1.0"
description = "Comparing RAG, tool-using agents and verifying agents on multi-step cybersecurity research tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jody-Ann Trimmingham" }]
dependencies = [
    "cyber-intel-mcp @ git+https://github.com/Jody2905/cyber-intel-mcp.git",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dataset"]
