name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python dataset/build.py && git diff --exit-code dataset/   # dataset is reproducible
      - run: python dataset/validate.py
      - run: pytest -v
